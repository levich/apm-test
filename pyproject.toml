[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "angie-proxy-manager"
version = "0.1.0.dev0"
description = "A self-hosted FastAPI and Tabler control plane for Angie"
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = [
  "passlib>=1.7.4,<2",
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0.36,<2.1", "alembic>=1.14,<2", "jinja2>=3.1.5,<4",
  "httpx>=0.28,<1", "cryptography>=44", "pwdlib[argon2]>=0.2,<1",
  "python-multipart>=0.0.20", "pyotp>=2.9,<3", "authlib>=1.4,<2",
  "itsdangerous>=2.2,<3", "dnspython>=2.7,<3", "pyjwt[crypto]>=2.10,<3",
  "typer>=0.15,<1", "psycopg[binary]>=3.2,<4", "certbot>=5.0,<6",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "playwright>=1.50,<2", "grpcio>=1.70,<2", "aioquic>=1.2,<2"]

[project.scripts]
apm = "apm.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/apm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
