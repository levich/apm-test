name: checks
on: [push, pull_request]
permissions: { contents: read }
jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          { version: "0.12.3", python-version: "3.13.15", enable-cache: true }
      - run: uv sync --frozen --group dev --no-editable
      - run: uv run --frozen --no-sync ruff check src tests scripts
      - run: uv run --frozen --no-sync pytest
      - run: cp .env.example .env && docker compose config --quiet
      - run: docker compose -f compose.yaml -f compose.local.yaml config --quiet
      - run: cp .env.existing.example .env.existing && docker compose --env-file .env.existing -f compose.existing.yaml config --quiet
      - run: docker compose --env-file .env.existing -f compose.existing.yaml --profile discovery config --quiet
  images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: apm-manager:dev
  compose:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.12.3", python-version: "3.13.15" }
      - run: uv sync --frozen --group dev --no-editable
      - run: cp .env.example .env
      - run: docker compose build manager && docker compose build angie
      - run: docker compose up -d
      - run: uv run --frozen --no-sync python scripts/check_compose.py
      - if: failure()
        run: docker compose logs --tail 100
      - if: always()
        run: docker compose down
